scopeName: source.tppextension
name: TPP Extension
patterns:
	- include: '#keywords'
	- include: '#strings'

repository:
	keywords:
		pattern:
			name: keyword.control.tppextension
			match: \b(if|else|while|for|return|break|continue)\b

	strings:
		pattern:
			- name: string.quoted.double.tppextension
			- match: '"(?:\\.|[^"\\])*"'

scopeName: source.tppextension 